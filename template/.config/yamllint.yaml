---
extends: "default"

ignore: |
  .venv/
  .mise/
  tmp/
  .copier-answers.yml
  .openspec.yaml
  openspec/schemas/

rules:
  # A composite action's SHA pin with its version comment cannot fit 88 columns. A
  # workflow step's `run` script and expressions often cannot either. jactionlint checks
  # these files instead.
  line-length:
    max: 88
    ignore: |
      **/.github/workflows/
      **/action.yml
      **/action.yaml

  # Quoting every string also catches unquoted Ansible `name` and `notify` values.
  quoted-strings:
    required: true
    quote-type: "double"
    check-keys: false

  truthy:
    level: "error"
    check-keys: false

  comments:
    min-spaces-from-content: 1

  # ansible-lint expects `{{ var }}` with inner spaces.
  braces:
    max-spaces-inside: 1

  brackets:
    max-spaces-inside: 1

  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
