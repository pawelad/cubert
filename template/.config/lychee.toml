# Template-owned. The lychee hk step (offline) and `mise run audit` (online) share it.
# 429 means rate limited, so the link may still be fine.
accept = ["200..=299", "429"]
# A timeout or 5xx is often transient. lychee doubles the wait after each retry.
max_retries = 4
retry_wait_time = 5
timeout = 20
# The paths in `.config/hk/frozen.pkl`: text that another program wrote.
exclude_path = [
  "/openspec/changes/archive/",
  "/openspec/schemas/",
  "/fixtures/",
  "/testdata/",
  "/__snapshots__/",
  "/generated/",
  "/vendor/",
]
