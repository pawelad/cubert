# cubert's own tools and tasks. Shared settings and tasks: .config/mise/, which links
# into template/. A task with logic goes in mise-tasks/ as a file task.

[tools]
betterleaks = "1.9.0"
dprint = "0.64.3"
hk = "2.11.1"
jactionlint = "2.5.0"
jq = "1.8.2"
lychee = "0.24.2"
# npm: tools run on this Node, so CI and every machine use the same one.
node = "24.22.2"
pkl = "0.32.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
typos = "1.52.0"
uv = "0.13.7"
worktrunk = "0.81.0"
yamllint = { version = "1.38.0", python = "3.14" }
"npm:@fission-ai/openspec" = "1.16.0"
"pypi:copier" = { version = "9.19.1", python = "3.14" }
ruff = "0.17.4"
zizmor = "1.32.0"
osv-scanner = "2.7.0"
git-cliff = "2.14.2"
# Its release assets are bare binaries named after the platform, such as `linux-amd64`.
"github:github/gh-actions-lock" = { version = "0.5.1", bin = "gh-actions-lock" }

[tasks."test:scripts"]
description = "Run the unit tests for the check scripts"
usage = 'arg "[files]..." help="Test files to run"'
# mise passes usage args only as usage_* variables, and the list must split into words.
# A full run spreads over every core. A few named files run faster in one process.
run = '''
# shellcheck disable=SC2086
uv run pytest ${usage_files:--n auto}
'''

[tasks."test:oldest-python"]
description = "Run the shipped check script tests on Python 3.11, the oldest they declare"
# Projects pin their own Python, and uv warns on each hook run below requires-python.
# uv.lock targets 3.14, so pytest resolves here, with the same 7-day cooldown.
run = """
uv run --isolated --no-project --python 3.11 --exclude-newer "7 days" --with pytest pytest \
  tests/test_check_comment_length.py tests/test_check_file_length.py \
  tests/test_check_pins.py tests/test_check_required_tools.py \
  tests/test_check_lockfile.py tests/test_check_mypy.py \
  tests/test_check_commit_scope.py tests/test_check_docker_pins.py \
  tests/test_check_collections.py tests/test_check_task_names.py
"""

[tasks."audit:actions"]
description = "Run zizmor's online audits on workflows and actions, such as known vulnerabilities (needs the network)"
# zizmor reads actions.lock only at the git root, so the template's workflows take the
# tag policy, as in the zizmor-template hk step.
run = '''
if [ -z "${GITHUB_TOKEN:-}" ] && command -v gh >/dev/null && token="$(gh auth token 2>/dev/null)"; then
  export GITHUB_TOKEN="$token"
fi
if [ -z "${GITHUB_TOKEN:-}" ]; then
  echo "audit:actions: zizmor needs a GitHub token for its online audits. Fix: gh auth login" >&2
  exit 1
fi
zizmor --no-progress .github/workflows/*.yml .github/dependabot.yml template/.github/actions/*/action.yml
zizmor --no-progress --config .config/zizmor-template.yml template/.github/workflows/*.yml
'''

[tasks.upgrade]
description = "Upgrade cubert's tools and the template's dprint plugins"
usage = 'arg "[tools]..." help="Tools to upgrade"'
# mise passes usage args only as usage_* variables, and the list must split into words.
run = '''
# shellcheck disable=SC2086
mise upgrade --bump --no-global ${usage_tools:-}
dprint config update --config template/.config/dprint.json --yes
dprint config update --yes \
  --config "template/.config/[% if docker %]dprint-docker.json[% endif %]"
'''
