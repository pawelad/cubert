# cubert's own tools and tasks. Shared settings and tasks: .config/mise/, which links
# into template/. A task with logic goes in mise-tasks/ as a file task.

[tools]
betterleaks = "1.9.0"
dprint = "0.64.3"
hk = "2.11.1"
jactionlint = "2.5.0"
jq = "1.8.2"
lychee = "0.24.2"
# npm: tools run on this Node, so CI and every machine use the same one.
node = "24.22.2"
pkl = "0.32.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
typos = "1.52.0"
uv = "0.13.7"
worktrunk = "0.81.0"
yamllint = { version = "1.38.0", python = "3.14" }
"npm:@fission-ai/openspec" = "1.16.0"
"pypi:copier" = { version = "9.19.1", python = "3.14" }
ruff = "0.17.4"
zizmor = "1.32.0"
osv-scanner = "2.7.0"
git-cliff = "2.14.2"

[tasks."test:scripts"]
description = "Run the unit tests for the check scripts"
usage = 'arg "[files]..." help="Test files to run"'
# mise passes usage args only as usage_* variables, and the list must split into words.
run = '''
# shellcheck disable=SC2086
uv run pytest ${usage_files:-}
'''

[tasks."test:oldest-python"]
description = "Run the shipped check script tests on Python 3.11, the oldest they declare"
# Projects pin their own Python, and uv warns on each hook run below requires-python.
run = """
uv run --isolated --no-project --python 3.11 --with pytest pytest \
  tests/test_check_comment_length.py tests/test_check_file_length.py \
  tests/test_check_pins.py tests/test_check_required_tools.py \
  tests/test_check_lockfile.py tests/test_check_mypy.py
"""

[tasks.upgrade]
description = "Upgrade cubert's tools and the template's dprint plugins"
usage = 'arg "[tools]..." help="Tools to upgrade"'
# mise passes usage args only as usage_* variables, and the list must split into words.
run = '''
# shellcheck disable=SC2086
mise upgrade --bump ${usage_tools:-}
dprint config update --config template/.config/dprint.json --yes
dprint config update --yes \
  --config "template/.config/[% if docker %]dprint-docker.json[% endif %]"
'''
