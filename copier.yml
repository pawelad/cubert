---
_min_copier_version: "9.19"
_subdirectory: "template"
_preserve_symlinks: true
_answers_file: ".copier-answers.yml"

# Template files use [[ ]] and [% %]: hk, mise, worktrunk and Actions all use {{ }}.
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

# Conditions here, not in path names: dprint cannot exclude a path that holds [ ].
_exclude:
  - "copier.yml"
  - ".git"
  - "[% if openspec == 'none' %]openspec[% endif %]"
  - "[% if openspec != 'spec-driven' %]openspec/specs[% endif %]"

# Created once, then owned by the project. Copier creates a deleted one again on update.
_skip_if_exists:
  - "mise.toml"
  - "hk.pkl"
  - "dprint.json"
  - ".yamllint"
  - ".github/workflows/ci.yml"
  - ".github/workflows/audit.yml"
  - ".worktreeinclude"
  - ".worktreelinks"
  - "docs/setup.md"
  - "LICENSE"
  - "CONTRIBUTING.md"
  - "pyproject.toml"
  - "biome.json"
  - ".python-version"
  - "cliff.toml"
  - "CHANGELOG.md"
  - "[[ tofu_dir ]]/versions.tf"
  - "[[ ansible_dir ]]/.gitkeep"
  - "openspec/changes/.gitkeep"
  - "openspec/specs/.gitkeep"

_message_after_copy: |
  Next steps in [[ _copier_conf.dst_path ]]:

    git init     (if it is not a repository yet)
    mise trust
    mise run setup
    mise run check

project_name:
  type: "str"
  help: "Project name, as the repository is named"
  validator: "[% if not project_name %]Required[% endif %]"

description:
  type: "str"
  help: "One-line description, a full sentence"
  validator: "[% if not description %]Required[% endif %]"

github_owner:
  type: "str"
  help: "GitHub user or organization that owns the repository"
  default: "pawelad"

license:
  type: "str"
  help: "License"
  choices:
    Mozilla Public License 2.0: "MPL-2.0"
    All rights reserved: "ARR"
  default: "MPL-2.0"

# Stored in the answers file, so a later cubert release does not change the year.
copyright_year:
  type: "str"
  help: "Copyright year, the year of first publication"
  default: "2026"
  when: "[[ license == 'ARR' ]]"

python:
  type: "bool"
  help: "Python project with pyproject.toml at the root (ruff, mypy, Dependabot uv)?"
  default: false

typescript:
  type: "bool"
  help: "TypeScript with Bun (biome, tsc, bun test, Dependabot bun)?"
  default: false

typescript_dirs:
  type: "yaml"
  help: "Directories with package.json and tsconfig.json, one tsc check each"
  default: ["."]
  when: "[[ typescript ]]"
  validator: |
    [% if typescript_dirs is string or typescript_dirs is mapping
          or typescript_dirs is not sequence or not typescript_dirs %]
    Enter a nonempty list of relative directories, such as ["apps/web"].
    [% else %]
    [% for dir in typescript_dirs %]
    [% if dir is not string or not dir %]
    Each directory must be a nonempty string.
    [% elif dir.startswith('/') or '..' in dir.split('/') %]
    Directories must stay inside the project.
    [% elif dir | regex_search('^([.]/+)*-') %]
    The first path component cannot start with a hyphen.
    [% elif dir | regex_search('[^A-Za-z0-9._/-]') %]
    Use ASCII letters, numbers, periods, underscores, hyphens and slashes in paths.
    [% endif %]
    [% endfor %]
    [% endif %]

docker:
  type: "bool"
  help: "Docker images or Compose files (hadolint, dclint, Dependabot docker)?"
  default: false

opentofu:
  type: "bool"
  help: "OpenTofu infrastructure (tofu fmt and validate, Dependabot opentofu)?"
  default: false

tofu_dir:
  type: "str"
  help: "OpenTofu directory"
  default: "opentofu"
  when: "[[ opentofu ]]"
  validator: |
    [% if not tofu_dir or tofu_dir.startswith('/') or '..' in tofu_dir.split('/')
          or tofu_dir | regex_search('[^A-Za-z0-9._/-]|^([.]/+)*-') %]
    Use a relative project path with ASCII letters, numbers, periods, underscores,
    hyphens and slashes. The first path component cannot start with a hyphen.
    [% endif %]

ansible:
  type: "bool"
  help: "Ansible playbooks (ansible-lint, syntax check)?"
  default: false

ansible_dir:
  type: "str"
  help: "Ansible directory"
  default: "ansible"
  when: "[[ ansible ]]"
  validator: |
    [% if not ansible_dir or ansible_dir.startswith('/')
          or '..' in ansible_dir.split('/')
          or ansible_dir | regex_search('[^A-Za-z0-9._/-]|^([.]/+)*-') %]
    Use a relative project path with ASCII letters, numbers, periods, underscores,
    hyphens and slashes. The first path component cannot start with a hyphen.
    [% endif %]

openspec:
  type: "str"
  help: "OpenSpec change proposals"
  choices:
    None: "none"
    Changes only (proposal, design, tasks): "changes-only"
    Spec-driven (proposal, specs, design, tasks): "spec-driven"
  default: "changes-only"

changelog:
  type: "bool"
  help: "Changelog from commits (git-cliff, CHANGELOG.md, release:preview)?"
  default: false

# Constants. Not asked, and not stored in the answers file.
author_name:
  type: "str"
  default: "Paweł Adamczak"
  when: false

author_url:
  type: "str"
  default: "https://pawelad.me/"
  when: false
