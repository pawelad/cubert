---
_min_copier_version: "9.19"
_subdirectory: "template"
_preserve_symlinks: true
_answers_file: ".copier-answers.yml"

# Template files use [[ ]] and [% %]: hk, mise, worktrunk and Actions all use {{ }}.
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

# Conditions here, not in path names: dprint cannot exclude a path that holds [ ].
_exclude:
  - "copier.yml"
  - ".git"
  - "[% if openspec == 'none' %]openspec[% endif %]"
  - "[% if openspec != 'spec-driven' %]openspec/specs[% endif %]"
  - "[% if not openspec_changes_tracked %]openspec/changes/.gitkeep[% endif %]"
  - "[% if not opentofu_state_backup %].config/opentofu[% endif %]"

# Created once, then owned by the project. Copier creates a deleted one again on update.
_skip_if_exists:
  - "mise.toml"
  - "hk.pkl"
  - "dprint.json"
  - ".yamllint"
  - ".github/workflows/ci.yml"
  - ".github/workflows/audit.yml"
  - ".worktreeinclude"
  - ".worktreelinks"
  - "docs/setup.md"
  - "LICENSE"
  - "CONTRIBUTING.md"
  - "pyproject.toml"
  - "biome.json"
  - ".python-version"
  - "cliff.toml"
  - "CHANGELOG.md"
  - "[[ opentofu_dir ]]/versions.tf"
  - "[[ opentofu_dir ]]/mise.toml"
  - "[[ opentofu_dir ]]/fnox.toml"
  - "[[ ansible_dir ]]/.gitkeep"
  - "openspec/changes/.gitkeep"
  - "openspec/specs/.gitkeep"

_message_after_copy: |
  Next steps in [[ _copier_conf.dst_path ]]:

    git init     (if it is not a repository yet)
    mise trust
    mise run setup
    mise run check

project_name:
  type: "str"
  help: "Project name, as the repository is named"
  validator: "[% if not project_name %]Required[% endif %]"

description:
  type: "str"
  help: "One-line description, a full sentence"
  validator: "[% if not description %]Required[% endif %]"

github_owner:
  type: "str"
  help: "GitHub user or organization that owns the repository"
  default: "pawelad"

license:
  type: "str"
  help: "License"
  choices:
    Mozilla Public License 2.0: "MPL-2.0"
    All rights reserved: "ARR"
  default: "MPL-2.0"

# Stored in the answers file, so a later cubert release does not change the year. No
# default: a fixed one goes stale each January, and Copier's `now()` is deprecated.
copyright_year:
  type: "str"
  help: "Copyright year, the year of first publication"
  when: "[[ license == 'ARR' ]]"
  validator: |
    [% if not copyright_year | regex_search('^[0-9]{4}$') %]
    Enter a year, such as 2026.
    [% endif %]

python:
  type: "bool"
  help: "Python project with pyproject.toml at the root (ruff, mypy, Dependabot uv)?"
  default: false

typescript:
  type: "bool"
  help: "TypeScript with Bun (biome, tsc, bun test, Dependabot bun)?"
  default: false

typescript_dirs:
  type: "yaml"
  help: "Directories with package.json and tsconfig.json, one tsc check each"
  default: ["."]
  when: "[[ typescript ]]"
  validator: |
    [% if typescript_dirs is string or typescript_dirs is mapping
          or typescript_dirs is not sequence or not typescript_dirs %]
    Enter a nonempty list of relative directories, such as ["apps/web"].
    [% else %]
    [% for dir in typescript_dirs %]
    [% if dir is not string or not dir %]
    Each directory must be a nonempty string.
    [% elif dir.startswith('/') or '..' in dir.split('/') %]
    Directories must stay inside the project.
    [% elif dir | regex_search('[^A-Za-z0-9._/-]') %]
    Use ASCII letters, numbers, periods, underscores, hyphens and slashes in paths.
    [% elif dir != '.' and not dir | regex_search(
            '^(?![-])(?!(.*/)?[.][.]?(/|$))'
            ~ '[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$') %]
    Write each path as apps/web: no ./, trailing or double slash, or leading hyphen.
    [% endif %]
    [% endfor %]
    [% endif %]

docker:
  type: "bool"
  help: "Docker images or Compose files (hadolint, dclint, Dependabot docker)?"
  default: false

opentofu:
  type: "bool"
  help: "OpenTofu infrastructure (tofu fmt and validate, Dependabot opentofu)?"
  default: false

# .gitignore writes the path as given, and git never matches `./x` or `x//y`.
opentofu_dir:
  type: "str"
  help: "OpenTofu directory"
  default: "opentofu"
  when: "[[ opentofu ]]"
  validator: |
    [% if opentofu_dir | regex_search('[^A-Za-z0-9._/-]')
          or not opentofu_dir | regex_search(
            '^(?![-])(?!(.*/)?[.][.]?(/|$))'
            ~ '[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$') %]
    Use a relative project path, such as infra/opentofu, with ASCII letters, numbers,
    periods, underscores, hyphens and slashes. No ./, .., trailing or double slash, or
    leading hyphen.
    [% endif %]

opentofu_state_backup:
  type: "bool"
  help: "Back up the encrypted state from R2 to B2 (GitHub Actions, opentofu:apply)?"
  default: false
  when: "[[ opentofu ]]"

# B2 names the backup bucket <bucket>-backups, and allows at most 63 characters.
opentofu_state_bucket:
  type: "str"
  help: "R2 bucket that holds the encrypted OpenTofu state"
  default: "[[ project_name ]]-opentofu-state"
  when: "[[ opentofu_state_backup ]]"
  validator: |
    [% if not opentofu_state_bucket
          | regex_search('^[a-z0-9][a-z0-9-]{4,53}[a-z0-9]$') %]
    Use 6 to 55 lowercase letters, numbers and hyphens, with no hyphen at either end.
    [% endif %]

secrets_provider:
  type: "str"
  help: "Where the OpenTofu operator credentials live"
  choices:
    A Proton Pass vault, through fnox: "proton-pass"
    age-encrypted in fnox.toml: "age"
    A gitignored .env file: "none"
  default: "none"
  when: "[[ opentofu ]]"

# No default: each project gets its own vault, and a shared name would mix projects.
secrets_vault:
  type: "str"
  help: "Proton Pass vault that holds this project's operator credentials"
  when: "[[ opentofu and secrets_provider == 'proton-pass' ]]"
  validator: "[% if not secrets_vault %]Required[% endif %]"

secrets_age_recipient:
  type: "str"
  help: "age public key for the credentials: age-keygen -y ~/.config/fnox/age.txt"
  when: "[[ opentofu and secrets_provider == 'age' ]]"
  validator: |
    [% if not secrets_age_recipient | regex_search('^age1[02-9ac-hj-np-z]{58}$') %]
    Enter an age public key, which starts with age1.
    [% endif %]

ansible:
  type: "bool"
  help: "Ansible playbooks (ansible-lint, syntax check)?"
  default: false

# .gitignore writes the path as given, and git never matches `./x` or `x//y`.
ansible_dir:
  type: "str"
  help: "Ansible directory"
  default: "ansible"
  when: "[[ ansible ]]"
  validator: |
    [% if ansible_dir | regex_search('[^A-Za-z0-9._/-]')
          or not ansible_dir | regex_search(
            '^(?![-])(?!(.*/)?[.][.]?(/|$))'
            ~ '[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$') %]
    Use a relative project path, such as infra/ansible, with ASCII letters, numbers,
    periods, underscores, hyphens and slashes. No ./, .., trailing or double slash, or
    leading hyphen.
    [% endif %]

openspec:
  type: "str"
  help: "OpenSpec change proposals"
  choices:
    None: "none"
    Changes only (proposal, design, tasks): "changes-only"
    Spec-driven (proposal, specs, design, tasks): "spec-driven"
  default: "changes-only"

# Untracked changes stay in the primary checkout, and each worktree links them.
openspec_changes_tracked:
  type: "bool"
  help: "Track OpenSpec changes in git (no: ignore them, and link them into worktrees)?"
  default: true
  when: "[[ openspec != 'none' ]]"

changelog:
  type: "bool"
  help: "Changelog from commits (git-cliff, CHANGELOG.md, release:preview)?"
  default: false

# Constants. Not asked, and not stored in the answers file.
author_name:
  type: "str"
  default: "Paweł Adamczak"
  when: false

author_url:
  type: "str"
  default: "https://pawelad.me/"
  when: false

# CODEOWNERS needs a user: GitHub rejects an organization, such as an org github_owner.
github_user:
  type: "str"
  default: "pawelad"
  when: false
