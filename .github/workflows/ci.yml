---
name: "CI"

on:
  push:
    branches: ["main"]
    # A release commit only adds the CHANGELOG.md section, and its parent passed CI.
    paths-ignore: ["CHANGELOG.md"]
  pull_request:
  workflow_dispatch:
  # New advisories and tool releases appear without a commit: audit and render weekly.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: "read"

# Each render resolves `latest` for every tool. Unauthenticated GitHub API calls hit
# the rate limit.
env:
  MISE_GITHUB_TOKEN: "${{ github.token }}"

# Per event: a push must not cancel the full matrix that a manual or weekly run renders.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  check:
    name: "Check"
    if: "github.event_name != 'schedule'"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      # cubert uses the action that it ships to projects.
      - name: "Set up mise"
        uses: "$/template/.github/actions/setup-mise"

      # The task that a project's check job runs.
      - name: "Run the checks and tests"
        run: "mise run ci:check"

  # Needs the network, so it is not part of `mise run check`. A new advisory fails this
  # job and leaves the check job green.
  audit:
    name: "Audit"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Set up mise"
        uses: "$/template/.github/actions/setup-mise"

      - name: "Audit the dependencies, actions and links"
        env:
          # zizmor needs it for its online audits. lychee uses it to avoid rate limits.
          GITHUB_TOKEN: "${{ github.token }}"
        run: "mise run audit"

  update:
    name: "Update from the previous commit"
    if: "github.event_name != 'schedule'"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    steps:
      # e2e:update renders HEAD~1, so it needs history.
      - name: "Check out the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "Set up mise"
        uses: "$/template/.github/actions/setup-mise"

      - name: "Configure Git for the test commits"
        run: |
          git config --global user.name "cubert CI"
          git config --global user.email "ci@users.noreply.github.com"

      - name: "Test the update"
        run: |
          mise run e2e:update --out "${RUNNER_TEMP}/update"

      - name: "Test an update that conflicts"
        run: |
          mise run e2e:conflict --out "${RUNNER_TEMP}/conflict"

      - name: "Preserve failure logs"
        if: "failure()"
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: "update-logs"
          path: |
            ${{ runner.temp }}/update/*.log*
            ${{ runner.temp }}/conflict/*.log*
          if-no-files-found: "ignore"
          retention-days: 3

  adopt:
    name: "Adopt in an existing repository"
    if: "github.event_name != 'schedule'"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Set up mise"
        uses: "$/template/.github/actions/setup-mise"

      - name: "Adopt the template in each existing layout"
        run: |
          mise run e2e:adopt --out "${RUNNER_TEMP}/adopt"

      - name: "Preserve failure logs"
        if: "failure()"
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: "adopt-logs"
          path: "${{ runner.temp }}/adopt/*.log*"
          if-no-files-found: "ignore"
          retention-days: 3

  # Push and PR runs render 8 combinations that cover every pair of answer values.
  render-pairwise:
    name: "Render pairwise"
    if: "github.event_name == 'push' || github.event_name == 'pull_request'"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Set up mise"
        uses: "$/template/.github/actions/setup-mise"

      - name: "Render the pairwise combinations"
        run: |
          mise run e2e:render --pairwise --jobs 4 --out "${RUNNER_TEMP}/renders"

      - name: "Preserve failure logs"
        if: "failure()"
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: "render-logs-pairwise"
          path: "${{ runner.temp }}/renders/*.log*"
          if-no-files-found: "ignore"
          retention-days: 3

  # Weekly and manual runs render all 192. Each job renders every other feature
  # combination. The name shows the OpenSpec option and TypeScript, so the job list
  # does not truncate what differs.
  render:
    name: "${{ matrix.openspec }}, ${{ matrix.typescript == '1' && 'TS' || 'no TS' }}"
    if: "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        openspec: ["none", "changes-only", "spec-driven"]
        typescript: ["0", "1"]
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Set up mise"
        uses: "$/template/.github/actions/setup-mise"

      - name: "Render every feature combination"
        env:
          OPENSPEC: "${{ matrix.openspec }}"
          TYPESCRIPT: "${{ matrix.typescript }}"
        run: |
          mise run e2e:render --jobs 4 --out "${RUNNER_TEMP}/renders" \
            --filter "s${TYPESCRIPT}_${OPENSPEC}\$"

      - name: "Preserve failure logs"
        if: "failure()"
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: "render-logs-${{ matrix.typescript }}-${{ matrix.openspec }}"
          path: "${{ runner.temp }}/renders/*.log*"
          if-no-files-found: "ignore"
          retention-days: 3
